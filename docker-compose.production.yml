services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: aura-store:production
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - aura-storage:/var/www/html/storage
      - ./legacy:/var/www/legacy:ro
    networks:
      aura-internal:
      techcel:
        aliases:
          - aura-app
    healthcheck:
      test: ["CMD-SHELL", "php artisan about --only=environment >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./public:/var/www/html/public:ro
      - aura-storage:/var/www/html/storage:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "8080"
    networks:
      aura-internal:
      techcel:
        aliases:
          - aura-nginx

volumes:
  aura-storage:

networks:
  aura-internal:
    internal: true
  techcel:
    external: true
    name: techcel_techcel-prod
