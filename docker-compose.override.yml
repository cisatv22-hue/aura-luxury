
services:
  dolibarr:
    volumes:
      # Only Modules Editas
      - ./custom:/var/www/html/custom

      # System configuration
      - ./conf/conf.php:/var/www/html/conf/conf.php

      # Generated files/documents
      - ./documents:/var/www/documents

      # Optional: If you edit vendor
      - ./vendor:/var/www/html/vendor

      # Optional: If you get to play public (Assets, etc.)
      - ./public:/var/www/html/public

      - ./admin:/var/www/html/admin

      - ./opensurvey:/var/www/html/opensurvey
      - ./takepos:/var/www/html/takepos

  # AuraShop frontend (Vue + Vite). Only starts with: docker compose --profile front ...
  aurashop-front:
    image: node:22-alpine
    profiles: ["front"]
    user: "1000:1000"
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      npm_config_cache: /tmp/.npm
      DOLIBARR_URL: http://dolibarr
    ports:
      - "5173:5173"
    volumes:
      - ./custom/aurashop/frontend:/app
      - ./public/AuraShop:/public/AuraShop
    depends_on:
      - dolibarr
