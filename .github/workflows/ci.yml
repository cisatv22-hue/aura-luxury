name: AURA Store

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: aura_store
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: aura_store
      DB_USERNAME: root
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
          package_json_file: package.json

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: intl, mbstring, pdo_mysql, sqlite3, zip, gd, exif
          coverage: none

      - name: Verify WebP image support
        run: >-
          php -r "exit(function_exists('imagecreatefromwebp') && function_exists('imagewebp') ? 0 : 1);"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit JavaScript dependencies
        run: pnpm audit

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --class=E2ESeeder --force

      - name: Audit PHP dependencies
        run: composer audit --locked

      - name: Build storefront assets
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start storefront
        run: |
          php artisan inertia:start-ssr > /tmp/aura-ssr.log 2>&1 &
          php -d zlib.output_compression=On artisan serve --host=127.0.0.1 --port=8000 > /tmp/aura-store.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13714/health > /dev/null && curl --fail --silent http://127.0.0.1:8000/ > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/aura-store.log
          cat /tmp/aura-ssr.log
          exit 1

      - name: Run browser and accessibility checks
        run: pnpm test:e2e

      - name: Check mobile Lighthouse performance
        run: |
          GZIP_PROXY_TARGET_PORT=8000 GZIP_PROXY_PORT=8001 node scripts/gzip-proxy.mjs &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8001/ > /dev/null; then
              break
            fi
            sleep 1
          done
          LIGHTHOUSE_BASE_URL=http://127.0.0.1:8001 pnpm test:lighthouse

      - name: Run application checks
        run: composer ci:check
